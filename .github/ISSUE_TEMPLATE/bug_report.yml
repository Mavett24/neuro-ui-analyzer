name: Bug report
description: Something in the analysis or the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Attention (heatmap, scanpath)
        - Layout diagnostics
        - Brain viewer
        - Deep research analysis
        - History
        - Landing page
        - Other
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot you analyzed
      description: If it's not confidential, attach it. The analysis is deterministic, so the same image reproduces the issue.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 142, macOS 15
